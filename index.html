<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="registration-card">
    <h1>Digital Skills Workshop Registration</h1>
    <form id="regForm" novalidate>
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="1" max="120" required>

      <label for="workshop">Workshop</label>
      <select id="workshop" name="workshop" required>
        <option value="">-- Select a workshop --</option>
        <option value="WEB">WEB — Web Design</option>
        <option value="DIG">DIG — Digital Literacy</option>
      </select>

      <button type="submit" id="submitBtn">Register</button>
    </form>
    <p id="result" role="alert"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
